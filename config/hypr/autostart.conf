# NOTHING dotfiles — autostart
# Noctalia is the base shell: it owns the bar, notifications, launcher,
# session menu, lockscreen and wallpaper. Waybar/SwayNC/hyprpaper configs
# stay in the repo as a documented fallback but are NOT started here —
# one bar, one notification daemon, one wallpaper setter.

exec-once = dbus-update-activation-environment --systemd --all
exec-once = noctalia
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

env = XCURSOR_SIZE, 24
env = HYPRCURSOR_SIZE, 24
env = XDG_CURRENT_DESKTOP, Hyprland
env = XDG_SESSION_DESKTOP, Hyprland
env = QT_QPA_PLATFORM, wayland
env = GDK_BACKEND, wayland,x11
env = SDL_VIDEODRIVER, wayland
env = MOZ_ENABLE_WAYLAND, 1
env = ELECTRON_OZONE_PLATFORM_HINT, auto
