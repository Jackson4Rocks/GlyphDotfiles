# NOTHING dotfiles — Hyprland keybinds
# Organized in sections. $mainMod is SUPER on a standard PC keyboard.
#
# ★ CONFIRMED bindings (from the existing Miniland setup — DO NOT CHANGE):
#   SUPER + M         → minimize the active window (miniland minimize)
#   SUPER + SHIFT + N → open the Miniland picker   (miniland picker)
#   SUPER + ALT + M   → open/toggle Miniland shelf (miniland toggle-shelf)
# These three reference the `miniland` helper (shipped in scripts/ and
# installed to ~/.local/bin by install.sh). They are graceful: if miniland
# or hyprctl is unavailable they notify instead of failing silently.
#
# NOTE — full historical parity: no other historical bindings were found in
# the repository or conversation context, so every binding below marked
# [NEW] is a fresh, documented default. If you have an older keybind map,
# supply it and these will be reconciled — nothing here is claimed as
# "previously agreed" beyond the three ★ rows above.
#
# Minimize semantics: SUPER+M moves the focused client to the hidden
# special:miniland workspace and remembers its origin; pressing SUPER+M
# again on a shelf window (or picking it in the picker) restores it.
# It NEVER closes or kills anything.

$mainMod = SUPER
$term = kitty
$fileManager = kitty --class yazi -e yazi
$launcher = fuzzel
$browser = xdg-open https://duckduckgo.com

# ── ★ Required Miniland bindings (verified, do not improvise) ───────────────
bind = $mainMod, M, exec, miniland minimize
bind = $mainMod SHIFT, N, exec, miniland picker
bind = $mainMod ALT, M, exec, miniland toggle-shelf

# ── [NEW] Applications ───────────────────────────────────────────────────────
bind = $mainMod, RETURN, exec, $term
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, B, exec, $browser
bind = $mainMod, D, exec, $launcher
bind = $mainMod, SPACE, exec, $launcher

# ── [NEW] Window management ──────────────────────────────────────────────────
bind = $mainMod, Q, killactive,
bind = $mainMod, F, fullscreen, 0
bind = $mainMod SHIFT, F, fullscreen, 1
bind = $mainMod SHIFT, SPACE, togglefloating,
bind = $mainMod, P, pseudo,
bind = $mainMod, O, layoutmsg, togglesplit
bind = $mainMod SHIFT, Q, exit,

# ── [NEW] Focus (arrows + vim keys) ──────────────────────────────────────────
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d
bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d
bind = $mainMod, TAB, cyclenext,

# ── [NEW] Move windows ───────────────────────────────────────────────────────
bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d
bind = $mainMod SHIFT, H, movewindow, l
bind = $mainMod SHIFT, L, movewindow, r
bind = $mainMod SHIFT, K, movewindow, u
bind = $mainMod SHIFT, J, movewindow, d

# ── [NEW] Workspaces 1–10 ────────────────────────────────────────────────────
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspacesilent, special:magic

# ── [NEW] Notifications (swaync; single daemon — dunst stays off) ────────────
bind = $mainMod, N, exec, swaync-client -t -sw
bind = $mainMod SHIFT, D, exec, swaync-client -d -sw

# ── [NEW] Screenshots (grim + slurp + swappy, all preinstalled) ──────────────
bind = , PRINT, exec, grim -g "$(slurp)" - | swappy -f -
bind = $mainMod, PRINT, exec, grim - | swappy -f -
bind = $mainMod SHIFT, PRINT, exec, grim -g "$(slurp -o)" - | swappy -f -

# ── [NEW] Session ────────────────────────────────────────────────────────────
bind = $mainMod, X, exec, wlogout
bind = $mainMod CTRL, L, exec, hyprlock

# ── [NEW] Theme ──────────────────────────────────────────────────────────────
bind = $mainMod CTRL, T, exec, kitty -e nothing-theme-switch

# ── Mouse: drag to move / resize ─────────────────────────────────────────────
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# ── Media / hardware keys (repeat where sensible) ────────────────────────────
binde = , XF86AudioRaiseVolume, exec, pamixer -i 5
binde = , XF86AudioLowerVolume, exec, pamixer -d 5
bind = , XF86AudioMute, exec, pamixer -t
binde = , XF86MonBrightnessUp, exec, brightnessctl set +5%
binde = , XF86MonBrightnessDown, exec, brightnessctl set 5%-
bind = , XF86AudioPlay, exec, playerctl play-pause
bind = , XF86AudioNext, exec, playerctl next
bind = , XF86AudioPrev, exec, playerctl previous
