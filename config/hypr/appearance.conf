# NOTHING dotfiles — Hyprland appearance
# Geometry, borders, rounding, blur, animation. Colors come from
# nothing-theme.conf. Restrained motion: one shared bezier, slide/pop only.

general {
    gaps_in = 6
    gaps_out = 12
    border_size = 2
    layout = dwindle
    resize_on_border = true
    allow_tearing = false
}

decoration {
    rounding = 14
    rounding_power = 2.0
    active_opacity = 1.0
    inactive_opacity = 0.96
    fullscreen_opacity = 1.0
    dim_inactive = false

    shadow {
        enabled = true
        range = 16
        render_power = 3
        scale = 1.0
    }

    blur {
        enabled = true
        size = 5
        passes = 2
        new_optimizations = true
        xray = false
    }
}

dwindle {
    preserve_split = true
    smart_split = false
    smart_resizing = true
}

master {
    smart_resizing = true
}

gestures {
    workspace_swipe_distance = 300
}

input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0
    accel_profile = adaptive

    touchpad {
        natural_scroll = true
        tap-to-click = true
        tap-and-drag = true
        disable_while_typing = true
    }
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    focus_on_activate = true
    initial_workspace_tracking = 1
    font_family = Doto, JetBrainsMono Nerd Font, monospace
}

xwayland {
    force_zero_scaling = false
}

binds {
    drag_threshold = 10
}

# ── Restrained Nothing motion: single curve, no bounce ──────────────────────
bezier = nothing, 0.25, 0.1, 0.25, 1.0

animation = windows, 1, 4, nothing, slide
animation = windowsIn, 1, 4, nothing, popin 85%
animation = windowsOut, 1, 4, nothing, popin 85%
animation = windowsMove, 1, 4, nothing, slide
animation = fade, 1, 4, nothing
animation = layers, 1, 4, nothing, slide
animation = workspaces, 1, 4, nothing, slidefade

# Thin monochrome window outline; no gradients, no neon.
windowrule {
    name = nothing-noctalia-float
    match:class = ^(dev.noctalia.Noctalia)$
    float = true
}
