# NOTHING dotfiles — Hyprland entry point
# Theme colors live in nothing-theme.conf (managed by install.sh /
# scripts/theme-switcher — never edit it by hand).
source = ~/.config/hypr/nothing-theme.conf
source = ~/.config/hypr/appearance.conf
source = ~/.config/hypr/keybinds.conf
source = ~/.config/hypr/autostart.conf
source = ~/.config/hypr/monitors.conf
