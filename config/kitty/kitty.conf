# NOTHING dotfiles — kitty
# Colors come from nothing-theme.conf (managed by install.sh / theme-switcher).
include nothing-theme.conf

# ── Typography: dot-matrix display + technical mono body ─────────────────────
# Doto carries headings/tabs; JetBrainsMono Nerd Font keeps terminal text
# legible. If neither is installed, kitty falls back to monospace.
font_family      Doto, JetBrainsMono Nerd Font Mono, monospace
bold_font        Doto, JetBrainsMono Nerd Font Mono Bold, monospace
italic_font      JetBrainsMono Nerd Font Mono Italic, monospace
bold_italic_font JetBrainsMono Nerd Font Mono Bold Italic, monospace
font_size        11.0
adjust_line_height 110%

cursor_shape     beam
cursor_blink_interval 0
shell_integration enabled
confirm_os_window_close 0

background_opacity 1.0
window_padding_width 14
single_window_padding_width 14
hide_window_decorations yes
remember_window_size no
window_border_width 1
draw_minimal_borders yes
window_margin_width 0

# Pill-shaped tabs echo the desktop's capsule indicators.
tab_bar_edge top
tab_bar_style powerline
tab_powerline_style round
tab_title_template "{title}"
active_tab_font_style bold
inactive_tab_font_style normal
tab_bar_margin_width 6
tab_bar_margin_height 4

allow_remote_control no
enable_audio_bell no
visual_bell_duration 0.0
bell_on_tab yes
scrollback_lines 10000
strip_trailing_spaces smart
select_by_word_characters @-./_~?&=%+#

# Fish is the default shell of this rice; fall back silently otherwise.
shell fish
