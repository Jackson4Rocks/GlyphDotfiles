# NOTHING dotfiles — fuzzel (Wayland-native application picker)
# Big tiled floating panel: large type, roomy padding, bold outline.
# Theme colors between the markers are managed by install.sh /
# scripts/theme-switcher. Edit layout here, colors in themes/*/.
[main]
font=Doto:size=16,JetBrainsMono Nerd Font:size=13
terminal=kitty
prompt="❯ "
icons-enabled=yes
show-actions=yes
width=62
lines=15
horizontal-pad=28
vertical-pad=20
inner-pad=12
tabs=4

[dpi-aware]
auto-detect=yes

[border]
width=2
radius=18

# NOTHING-THEME-BEGIN
[colors]
background=000000f2
text=ffffffff
match=ffffffff
selection=ffffffff
selection-text=000000ff
selection-match=000000ff
border=262626ff
# NOTHING-THEME-END
