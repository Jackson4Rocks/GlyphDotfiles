# NOTHING dotfiles — fuzzel (Wayland-native launcher)
# Theme colors between the markers are managed by install.sh /
# scripts/theme-switcher. Edit layout here, colors in themes/*/.
[main]
font=Doto:size=13,JetBrainsMono Nerd Font:size=11
terminal=kitty
prompt="❯ "
icons-enabled=yes
show-actions=yes
width=48
horizontal-pad=18
vertical-pad=12
inner-pad=8
lines=12
tabs=4

[dpi-aware]
auto-detect=yes

[border]
width=2
radius=14

# NOTHING-THEME-BEGIN
[colors]
background=000000f2
text=ffffffff
match=ffffffff
selection=ffffffff
selection-text=000000ff
selection-match=000000ff
border=262626ff
# NOTHING-THEME-END
