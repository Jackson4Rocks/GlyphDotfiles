# NOTHING theme — PURE WHITE (yazi)
# Installed to ~/.config/yazi/theme.toml by install.sh / theme-switcher.

[manager]
cwd = { fg = "#000000", bold = true }
hovered         = { fg = "#ffffff", bg = "#000000", bold = true }
preview_hovered = { fg = "#ffffff", bg = "#000000", bold = true }
find_keyword    = { fg = "#ffffff", bg = "#000000", bold = true }
find_position   = { fg = "#d92626", bold = true }
marker_copied   = { fg = "#ffffff", bg = "#525252" }
marker_cut      = { fg = "#ffffff", bg = "#d92626" }
marker_marked   = { fg = "#ffffff", bg = "#000000" }
marker_selected = { fg = "#ffffff", bg = "#000000" }
tab_active   = { fg = "#ffffff", bg = "#000000", bold = true }
tab_inactive = { fg = "#525252", bg = "#f4f4f4" }
tab_width = 2
border_symbol = "│"
border_style  = { fg = "#d4d4d4" }

[status]
separator_open  = ""
separator_close = ""
separator_style = { fg = "#d4d4d4", bg = "#ffffff" }
progress_label  = { fg = "#000000", bold = true }
progress_normal = { fg = "#d4d4d4", bg = "#d4d4d4" }
progress_error  = { fg = "#d92626", bg = "#d4d4d4" }
perm_type  = { fg = "#000000" }
perm_read  = { fg = "#525252" }
perm_write = { fg = "#525252" }
perm_exec  = { fg = "#000000", bold = true }
perm_sep   = { fg = "#8a8a8a" }

[input]
border   = { fg = "#000000" }
title    = { fg = "#000000", bold = true }
value    = { fg = "#000000" }
selected = { fg = "#ffffff", bg = "#000000" }

[select]
border  = { fg = "#000000" }
active  = { fg = "#ffffff", bg = "#000000", bold = true }
inactive = { fg = "#525252" }

[tasks]
border  = { fg = "#000000" }
title   = { fg = "#000000", bold = true }
hovered = { fg = "#ffffff", bg = "#000000" }

[which]
cols = 3
mask = { bg = "#ffffff" }
cand = { fg = "#525252" }
rest = { fg = "#8a8a8a" }
desc = { fg = "#d92626" }
separator = "  "
separator_style = { fg = "#8a8a8a" }

[help]
on      = { fg = "#000000", bold = true }
run     = { fg = "#525252" }
desc    = { fg = "#8a8a8a" }
hovered = { fg = "#ffffff", bg = "#000000", bold = true }
footer  = { fg = "#ffffff", bg = "#000000" }

[filetype]
rules = [
  { mime = "image/*",  fg = "#000000" },
  { mime = "video/*",  fg = "#000000", bold = true },
  { mime = "audio/*",  fg = "#525252" },
  { mime = "application/zip",             fg = "#d92626" },
  { mime = "application/gzip",            fg = "#d92626" },
  { mime = "application/x-{tar,bzip*,xz}", fg = "#d92626" },
  { name = "*", is = "orphan", fg = "#d92626" },
  { name = "*", is = "exec",   fg = "#000000", bold = true },
]
